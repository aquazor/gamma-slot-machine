# Deploys public/installation-guide/ (plain static HTML, no build step) to
# GitHub Pages. Triggers whenever that folder changes on main or dev, or can
# be run manually from the Actions tab.
name: Deploy installation guide to GitHub Pages

on:
  push:
    branches: ["main", "dev"]
    paths:
      - "public/installation-guide/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/installation-guide
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
